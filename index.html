--bg:#1c3d2c;--cream:#f5eee6;--card:#fbf7f0;--card2:#f3ece0;--tx:#233229;--mu:#6d7a72;--g:#1f412f;--g2:#1a5144;--gold:#957f50;--gold2:#d6c18a;--goldb:#efe6d3;--ok:#1a5144;--okb:#dcebe4;--wn:#7d5f26;--wnb:#f3e6c8;--bad:#a63d2a;--bd:#e4dccd;--field:#f3ead8;--fieldbd:#dfd2b6;--fieldf:#fcf6e9;--fh:54px;--sh:0 10px 30px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--cream);background:var(--bg) var(--tile) 0 0/150px 150px;font:16px/1.75 "Thmanyah Sans","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;min-height:100vh;position:relative}
body::before{content:"";position:fixed;left:-16vmin;bottom:-8vmin;height:88vmin;aspect-ratio:.697;background:#102a1d;opacity:.55;-webkit-mask:var(--m-logo) center/contain no-repeat;mask:var(--m-logo) center/contain no-repeat;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 14px 56px}
.serif{font-family:"Thmanyah Serif Display","Amiri","Aref Ruqaa",serif}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}

/* الشريط العلوي: الشعار + صورة المصحف */
.banner{position:relative;height:150px;border-radius:999px;overflow:hidden;background:var(--photo) center/cover;box-shadow:var(--sh),0 0 0 3px rgba(214,193,138,.28)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(149,127,80,.97) 0,rgba(149,127,80,.92) 24%,rgba(149,127,80,.4) 54%,rgba(149,127,80,0) 78%)}
.logo-h{position:absolute;left:36px;top:50%;transform:translateY(-50%);margin:0;line-height:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:default}
.logo{display:block;height:112px;aspect-ratio:.697;background:#f7f0e1;-webkit-mask:var(--m-logo) center/contain no-repeat;mask:var(--m-logo) center/contain no-repeat;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.banner.sm{height:150px;border-radius:0;box-shadow:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 6px 4px;color:var(--gold2);font-size:15px}
.mb{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;padding:4px 16px;border-radius:99px;background:rgba(255,255,255,.07);font-size:14px;color:var(--cream);border:1.5px solid rgba(214,193,138,.6);font-family:inherit;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.14)}

/* الحديث */
.hd{position:relative;text-align:center;margin:28px 4px 22px;padding:30px 20px 24px;border:1.5px solid rgba(214,193,138,.55);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.hd::before{content:"";position:absolute;top:-13px;left:50%;width:24px;height:24px;transform:translateX(-50%) rotate(45deg);background:var(--bg);border:1.5px solid var(--gold2);border-radius:6px}
.hd::after{content:"";position:absolute;top:-4px;left:50%;width:6px;height:6px;transform:translateX(-50%) rotate(45deg);background:var(--gold2)}
.hd .lbl{margin:0 0 4px;color:var(--gold2);font-size:17px;letter-spacing:.5px}
.hd .l1{margin:0;font-size:34px;line-height:1.5;font-weight:700;color:#fff}
.hd .l2{margin:2px 0 0;font-size:23px;line-height:1.9;color:var(--gold2)}
.hd .ln{width:64px;height:2px;margin:12px auto 8px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

/* البطاقات والنماذج */
.card{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:30px;padding:22px 20px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font-size:18px;margin:0 0 6px}
h2.pill{position:relative;display:inline-block;background:var(--g);color:#fff;border-radius:99px;padding:4px 36px 4px 22px;margin:2px 0 12px;margin-inline-start:16px;font-size:16px}
h2.pill::before{content:"";position:absolute;inset-inline-start:-20px;top:50%;width:38px;height:38px;transform:translateY(-50%) rotate(45deg);background:var(--gold);border-radius:11px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
h2.pill::after{content:"";position:absolute;inset-inline-start:-7px;top:50%;width:12px;height:12px;transform:translateY(-50%);border:2.5px solid #fff;border-radius:50%}
h2.pill .dd{color:var(--gold2);font-weight:400;font-size:12.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;counter-reset:f}
.f{grid-column:span 2}
label{display:flex;align-items:center;gap:8px;font-weight:500;margin:14px 0 5px;color:var(--g2)}
.fgrid label::before{counter-increment:f;content:counter(f,arabic-indic);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--goldb);color:var(--gold);font-size:13px;font-weight:700}
input,select,textarea{display:block;width:100%;height:var(--fh);padding:11px 16px;border:1.5px solid var(--fieldbd);border-radius:18px;background:var(--field);box-shadow:inset 0 2px 5px rgba(110,85,35,.09);color:var(--tx);font:inherit;line-height:28px;transition:background .2s,border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;background:var(--fieldf);border-color:var(--gold);box-shadow:inset 0 1px 2px rgba(110,85,35,.05),0 0 0 4px rgba(149,127,80,.22)}
textarea{resize:none;overflow:hidden}
.cnt{direction:ltr;display:flex;align-items:center;gap:8px;height:var(--fh);padding:0 5px;border:1.5px solid var(--fieldbd);border-radius:999px;background:var(--field);box-shadow:inset 0 2px 5px rgba(110,85,35,.09);transition:border-color .2s,box-shadow .2s,background .2s}
.cnt:focus-within{background:var(--fieldf);border-color:var(--gold);box-shadow:inset 0 1px 2px rgba(110,85,35,.05),0 0 0 4px rgba(149,127,80,.22)}
.cnt input{-webkit-appearance:none;appearance:none;flex:1 1 0;min-width:0;width:auto;height:100%;margin:0;padding:0 4px;border:0;border-radius:0;background:transparent;box-shadow:none;text-align:center;font-size:22px;font-weight:700;color:var(--g2);-webkit-text-fill-color:var(--g2);opacity:1}
.cnt input:focus{box-shadow:none;background:transparent}
.cb{-webkit-appearance:none;appearance:none;box-sizing:border-box;flex:0 0 44px;width:44px;min-width:44px;max-width:44px;height:44px;min-height:44px;max-height:44px;aspect-ratio:1/1;margin:0;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:26px;font-weight:700;line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .1s}
.cb.m{background:transparent;color:var(--gold);border:2px solid var(--gold)}
.cb.p{background:var(--g);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cb:active{transform:scale(.92)}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qh{font-size:12.5px;line-height:1.6;margin-top:6px;padding:0 4px;color:var(--mu)}.qh:empty{display:none}.qh.ok{color:var(--g2);font-weight:700}.qh.no{color:var(--bad)}.qs{display:block;font-size:11px;color:var(--mu);font-weight:400;margin-top:2px}
.pg{position:relative}
.pg em{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);font-size:13px;font-style:normal;color:var(--mu);pointer-events:none}
.pg input{padding-inline-start:72px;text-align:start;font-weight:700;color:var(--g2)}
.pg.has em{display:none}.pg.has input{padding-inline-start:16px}
.btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:99px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.sec{background:transparent;color:var(--tx);border:1.5px solid var(--gold);box-shadow:none;font-size:15px;font-weight:500}
.btn.sm{width:auto;margin:0;padding:8px 20px;font-size:14px}
.btn:disabled{opacity:.5}
.note{font-size:14px;color:var(--mu);margin:10px 0 0}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--g2));width:0;transition:width .35s}
.badge{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13px;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-wn{background:var(--wnb);color:var(--wn)}.b-bad{background:#f4ddd6;color:var(--bad)}.tmb{display:inline-block;padding:3px 14px;border-radius:99px;font-size:13.5px;margin:4px 0}.tmb.ok{background:var(--okb);color:var(--ok)}.tmb.late{background:var(--wnb);color:var(--wn)}.tmb.miss{background:#f4ddd6;color:var(--bad)}.tmw{margin:2px 0 8px;font-size:13px}.top{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;align-items:stretch;margin:28px 4px 18px}
.top .hd{margin:0;padding:26px 10px 16px;border-radius:26px;display:flex;flex-direction:column;justify-content:center}
.top .hd .lbl{font-size:13.5px}.top .hd .ln{width:44px;margin:8px auto 6px}.top .hd .l1{font-size:19px;line-height:1.6}.top .hd .l2{font-size:14.5px;line-height:1.85}
.svw{display:flex;flex-direction:column;align-items:center;gap:3px;margin:0;padding:12px 6px 8px;min-height:0;height:auto;border:1px solid var(--bd);border-radius:26px;background:var(--card);color:var(--tx);font:inherit;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;box-shadow:var(--sh);-webkit-tap-highlight-color:transparent}

/* ---------------- محلّل «نصاب اليوم»: يفهم الأوجه والآيات بأي صياغة ----------------

const SURAH = [['الفاتحة',7],['البقرة',286],['آل عمران',200],['النساء',176],['المائدة',120],['الأنعام',165],['الأعراف',206],['الأنفال',75],['التوبة',129],['يونس',109],['هود',123],['يوسف',111],['الرعد',43],['إبراهيم',52],['الحجر',99],['النحل',128],['الإسراء',111],['الكهف',110],['مريم',98],['طه',135],['الأنبياء',112],['الحج',78],['المؤمنون',118],['النور',64],['الفرقان',77],['الشعراء',227],['النمل',93],['القصص',88],['العنكبوت',69],['الروم',60],['لقمان',34],['السجدة',30],['الأحزاب',73],['سبأ',54],['فاطر',45],['يس',83],['الصافات',182],['ص',88],['الزمر',75],['غافر',85],['فصلت',54],['الشورى',53],['الزخرف',89],['الدخان',59],['الجاثية',37],['الأحقاف',35],['محمد',38],['الفتح',29],['الحجرات',18],['ق',45],['الذاريات',60],['الطور',49],['النجم',62],['القمر',55],['الرحمن',78],['الواقعة',96],['الحديد',29],['المجادلة',22],['الحشر',24],['الممتحنة',13],['الصف',14],['الجمعة',11],['المنافقون',11],['التغابن',18],['الطلاق',12],['التحريم',12],['الملك',30],['القلم',52],['الحاقة',52],['المعارج',44],['نوح',28],['الجن',28],['المزمل',20],['المدثر',56],['القيامة',40],['الإنسان',31],['المرسلات',50],['النبأ',40],['النازعات',46],['عبس',42],['التكوير',29],['الانفطار',19],['المطففين',36],['الانشقاق',25],['البروج',22],['الطارق',17],['الأعلى',19],['الغاشية',26],['الفجر',30],['البلد',20],['الشمس',15],['الليل',21],['الضحى',11],['الشرح',8],['التين',8],['العلق',19],['القدر',5],['البينة',8],['الزلزلة',8],['العاديات',11],['القارعة',11],['التكاثر',8],['العصر',3],['الهمزة',9],['الفيل',5],['قريش',4],['الماعون',7],['الكوثر',3],['الكافرون',6],['النصر',3],['المسد',5],['الإخلاص',4],['الفلق',5],['الناس',6]];
const QX = {
  norm: s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[ً-ٰٟـ‎‏‪-‮]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ئ/g, 'ي').replace(/ؤ/g, 'و').replace(/ء/g, '')

QX.S = {}; SURAH.forEach(([n], i) => { QX.S[QX.key(QX.norm(n).replace(/\s+/g, ''))] = i; });
QX.S[QX.key('بنياسرايل')] = 16; QX.S[QX.key('براءه')] = 8; QX.S[QX.key('تبارك')] = 66; QX.S[QX.key('المومن')] = 39; QX.S[QX.key('الدهر')] = 75;
QX.S[QX.key(QX.norm('المنافقين'))] = 62; QX.S[QX.key(QX.norm('المطففون'))] = 82; QX.S[QX.key(QX.norm('الاحزاب'))] = 32;
delete QX.S[QX.key('ص')]; delete QX.S[QX.key('ق')]; /* حرفان: لا يُفهمان سورتين إلا بعد كلمة «سورة» */
QX.NUMW = {}; QX.UNIT = {}; QX.DUAL = {};
Object.entries({ واحد:1, واحدة:1, اثنان:2, اثنين:2, ثنتين:2, ثلاثة:3, ثلاث:3, أربعة:4, أربع:4, خمسة:5, خمس:5, ستة:6, ست:6, سبعة:7, سبع:7, ثمانية:8, ثماني:8, تسعة:9, تسع:9, عشرة:10, عشر:10 }).forEach(([k, v]) => { QX.NUMW[QX.norm(k)] = v; });
Object.entries({ وجه:1, أوجه:1, وجهان:1, وجهين:1, صفحة:1, صفحات:1, صفحتين:1, صفحتان:1, ص:1, ربع:5, أرباع:5, حزب:10, أحزاب:10, جزء:20, أجزاء:20, جزءان:20, جزءين:20 }).forEach(([k, v]) => { QX.UNIT[QX.norm(k)] = v; });
Object.entries({ وجهان:2, وجهين:2, صفحتين:2, صفحتان:2, جزءان:2, جزءين:2 }).forEach(([k, v]) => { QX.DUAL[QX.norm(k)] = v; });
const QRNG = /^(الي|حتي|-|~)$/;

QX.seg = s => {
  /* يحوّل مقطعًا واحدًا إلى {pages:Set, cnt:عدد أوجه معدود، a:آيات} */
  const out = { pages: [], cnt: 0, a: 0, ok: false };
  const toks = s.replace(/(\d+)/g, ' $1 ').replace(/-/g, ' - ').replace(/\.\.+|…/g, ' ~ ').replace(/[().:\/\\|]/g, ' ').trim().split(/\s+/).filter(Boolean);
  const T = []; /* رموز مفهومة: {t:'n',v} {t:'s',i} {t:'r'} {t:'ayah'} {t:'u',m} {t:'w'} */
  for (let i = 0; i < toks.length; i++) {
    const w = toks[i];
    if (/^\d+$/.test(w)) { T.push({ t:'n', v:+w }); continue; }
    if (QRNG.test(w)) { T.push({ t:'r' }); continue; }
    if (/^(ايه|ايات|ايتين|ايتان|الايه|الايات)$/.test(w) || /^ال?ايه$/.test(w)) { T.push({ t:'ayah' }); continue; }
    if (w === 'سوره' || w === 'سورتي' || w === 'سور') { T.push({ t:'sw' }); continue; }
    let k = QX.key(w), nx = toks[i + 1] ? QX.key(toks[i + 1]) : '';
    if (w === 'ال' && nx === 'عمران') { T.push({ t:'s', i:2 }); i++; continue; }
    if (w === 'عم') { if (!(T.length && T[T.length - 1].t === 'u')) T.push({ t:'s', i:77 }); continue; } /* «عمّ» = النبأ، إلا في «جزء عمّ» */
    if (QX.S[k] !== undefined) { T.push({ t:'s', i:QX.S[k] }); continue; }
    if (w.length > 2 && w[0] === 'و' && QX.S[QX.key(w.slice(1))] !== undefined) { T.push({ t:'s', i:QX.S[QX.key(w.slice(1))] }); continue; } /* «والفلق» */
    if ((w === 'ص' || w === 'ق') && T.length && T[T.length - 1].t === 'sw') { T.push({ t:'s', i:w === 'ص' ? 37 : 49 }); continue; }
    if (QX.DUAL[w] !== undefined) { T.push({ t:'u', m:QX.UNIT[w], c:QX.DUAL[w] }); continue; }
    if (QX.UNIT[w] !== undefined) { T.push({ t:'u', m:QX.UNIT[w] }); continue; }
    if (QX.NUMW[w] !== undefined) { T.push({ t:'n', v:QX.NUMW[w], word:true }); continue; }
    if (w === 'نصف') { T.push({ t:'half' }); continue; }
  }
  const surahs = T.filter(x => x.t === 's').length, ayahW = T.some(x => x.t === 'ayah'), hasUnit = T.some(x => x.t === 'u');
  /* ---- مقطع آيات ---- */
  if (surahs || (ayahW && !hasUnit)) {
    /* عدد قبل «آيات» مباشرة = عدد الآيات: «٥ آيات» */
    if (T.filter(x => x.t === 'n').length === 1) for (let i = 1; i < T.length; i++) if (T[i].t === 'ayah' && T[i - 1].t === 'n') { out.a = T[i - 1].v; out.ok = out.a > 0; return out; }
    if (!surahs) {
      const nums = T.filter(x => x.t === 'n').map(x => x.v);
      if (!nums.length) return out;
      const rng = T.some(x => x.t === 'r') && nums.length > 1;
      out.a = rng ? Math.abs(nums[nums.length - 1] - nums[0]) + 1 : nums.length;
      out.ok = out.a > 0; return out;
    }
    /* مع سور: نجمع لكل ذكر سورةٍ أرقامَه (ما قبل أول سورة يُنسب إلى الأولى) */
    const pts = []; let lead = [];
    T.forEach(x => { if (x.t === 's') { pts.push({ i:x.i, n:lead }); lead = []; } else if (x.t === 'n') { if (pts.length) pts[pts.length - 1].n.push(x.v); else lead.push(x.v); } });
    const len = i => SURAH[i][1], full = (a, b) => { let c = 0; for (let j = Math.min(a, b); j <= Math.max(a, b); j++) c += len(j); return c; };
    const own = p => { const n = p.n; if (!n.length) return len(p.i); if (n.length === 1) return n[0] >= 1 && n[0] <= len(p.i) ? 1 : 0; const a = Math.max(1, Math.min(n[0], n[n.length - 1])), b = Math.min(len(p.i), Math.max(n[0], n[n.length - 1])); return b >= a ? b - a + 1 : 0; };
    const rangeBetween = T.some(x => x.t === 'r') && pts.length >= 2;
    if (rangeBetween && pts[0].i !== pts[pts.length - 1].i) {
      let p1 = pts[0], p2 = pts[pts.length - 1];
      if (p1.i > p2.i) { const t = p1; p1 = p2; p2 = t; }
      const st = p1.n.length ? Math.max(1, Math.min(p1.n[0], len(p1.i))) : 1, en = p2.n.length ? Math.max(1, Math.min(p2.n[p2.n.length - 1], len(p2.i))) : len(p2.i);
      out.a = (len(p1.i) - st + 1) + (p2.i - p1.i > 1 ? full(p1.i + 1, p2.i - 1) : 0) + en;
    } else if (rangeBetween) {
      const n = pts.reduce((c, p) => c.concat(p.n), []); out.a = n.length > 1 ? own({ i:pts[0].i, n }) : len(pts[0].i);
    } else out.a = pts.reduce((c, p) => c + own(p), 0);
    out.ok = out.a > 0; return out;
  }
  /* ---- مقطع أوجه ---- */
  const pushPages = (a, b) => { if (a < 1 || b < 1 || a > 604 || b > 604) return false; for (let p = Math.min(a, b); p <= Math.max(a, b); p++) out.pages.push(p); return true; };
  if (hasUnit || T.some(x => x.t === 'half')) {
    /* «٣ أوجه» / «وجهين» / «وجه واحد» / «ربع» / «نصف جزء»: عدد × حجم الوحدة؛ «وجه ٦٠» / «ص ٦٠»: رقم صفحة */
    for (let i = 0; i < T.length; i++) if (T[i].t === 'u') {
      const prev = T[i - 1], next = T[i + 1], m = T[i].m;
      if (T[i].c) { out.cnt += T[i].c * m; out.ok = true; if (next && next.t === 'n' && next.word) i++; continue; }
      if (prev && prev.t === 'half') { out.cnt += 0.5 * m; out.ok = true; continue; }
      if (prev && prev.t === 'n' && !prev.used) {
        const q = T[i - 2], q2 = T[i - 3]; prev.used = true;
        if (q && q.t === 'r' && q2 && q2.t === 'n') { q2.used = true; if (m === 1) { if (pushPages(q2.v, prev.v)) out.ok = true; } else { out.cnt += (Math.abs(prev.v - q2.v) + 1) * m; out.ok = true; } continue; }
        if (m === 1 && prev.v > 40) { if (pushPages(prev.v, prev.v)) out.ok = true; continue; } /* «٦٠ وجه» = الوجه ٦٠ */
        out.cnt += prev.v * m; out.ok = true; continue; }
      if (m === 1 && next && next.t === 'n' && !next.word) { /* وجه ٦٠ */
        let j = i + 1, a = T[j].v, b = a; if (T[j + 1] && T[j + 1].t === 'r' && T[j + 2] && T[j + 2].t === 'n') { b = T[j + 2].v; T[j + 2].used = true; }
        T[j].used = true; if (pushPages(a, b)) out.ok = true; continue; }
      if (next && next.t === 'n' && next.word) { next.used = true; out.cnt += next.v * m; out.ok = true; continue; }
      out.cnt += m; out.ok = true; /* «وجه»، «ربع»، «جزء» وحدها = واحد */
    }

    const left = T.filter(x => x.t === 'n' && !x.used && !x.word);
    if (!out.ok && left.length) { const a = left[0].v, b = left[left.length - 1].v; if (pushPages(a, b)) out.ok = true; }
    return out;

  let i = 0;
  while (i < T.length) {
    if (T[i].t !== 'n') { i++; continue; }
    let a = T[i].v, b = a, j = i + 1;
    while (T[j] && T[j].t === 'r' && T[j + 1] && T[j + 1].t === 'n') { b = T[j + 1].v; if (pushPages(a, b)) out.ok = true; a = b; j += 2; }
    if (j === i + 1) { if (pushPages(a, a)) out.ok = true; }
    i = j;
  }
  return out;
};

/* يفهم نصاب اليوم كله: يقسّمه إلى مقاطع (فاصلة، «+»، «و»، سطر…) ثم يجمع الأوجه (بلا تكرار الصفحة نفسها) والآيات */
QX.parse = text => {
  let s = QX.norm(text).trim();
  if (!s) return { f:0, a:0, ok:false };
  s = s.replace(/(\d)\s*و\s*(?=\d)/g, '$1;').replace(/\s+و\s+/g, ';').replace(/\s+و(?=\d)/g, ';').replace(/(\d)و\s+/g, '$1;');
  const parts = s.split(/[;,+&\n\r]+|\s*\/\s*|\s*×\s*/).map(x => x.trim()).filter(Boolean);
  const pages = new Set(); let cnt = 0, a = 0, ok = false;
  parts.forEach(p => { const r = QX.seg(p); r.pages.forEach(x => pages.add(x)); cnt += r.cnt; a += r.a; ok = ok || r.ok; });
  return { f: Math.round((pages.size + cnt) * 10) / 10, a, ok };
};

const qN = (n, ar) => { const x = n % 1 ? n.toFixed(1) : String(n); return ar ? x.replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]) : x; };
const qWords = (f, a, ar) => { const p = [];
  if (f) p.push(f === 1 ? 'وجه واحد' : f === 2 ? 'وجهان' : qN(f, ar) + (f >= 3 && f <= 10 ? ' أوجه' : ' وجهًا'));
  if (a) p.push(a === 1 ? 'آية واحدة' : a === 2 ? 'آيتان' : qN(a, ar) + (a >= 3 && a <= 10 ? ' آيات' : ' آية'));
  return p.join(' و'); };
const qHint = v => { const t = String(v == null ? '' : v).trim(); if (!t) return ''; const r = QX.parse(t); return r.ok ? `<small class="qs">${qWords(r.f, r.a, true)}</small>` : ''; };
const pageStr = (a, b) => !a ? '' : (b && b !== a ? a + ' إلى ' + b : a);
const okf = (r, k, t) => { const v = String(r[k] == null ? '' : r[k]).trim(); return t === 'c' ? cnum(v) > 0 : t === 'p' ? /\d/.test(LAT(v)) : !!v; };
const filled = r => FIELDS.filter(([k, , t]) => okf(r, k, t)).length;

S.wed = nextWed(riyadh());

const range = () => { if (S.mode === 'day') return [S.day, S.day];
  if (S.mode === 'month') { const [y, m] = S.month.split('-').map(Number); return [S.month + '-01', S.month + '-' + String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0')]; }
  if (S.mode === 'year') return [S.year + '-01-01', S.year + '-12-31']; return [S.from, S.to]; };

const cmpN = (a, b) => String(a.name).localeCompare(String(b.name), 'ar');
const key3 = r => r.muqraa + '|' + (r.halaqa || '') + '|' + r.name;
const genCode = () => { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', b = new Uint32Array(8); crypto.getRandomValues(b); return [...b].map(x => A[x % A.length]).join(''); };

function summarize() {
  const act = {}, actS = {}; S.rows.forEach(r => { const g = r.muqraa + '|' + (r.halaqa || ''); (act[g] = act[g] || new Set()).add(r.day); if (dow(r.day) <= 4) (actS[g] = actS[g] || new Set()).add(r.day); });
  const m = {}; S.rows.forEach(r => { const k = key3(r); const o = m[k] = m[k] || { muqraa:r.muqraa, halaqa:r.halaqa || '', name:r.name, sent:0, done:0, ot:0, lt:0, last:'', ids:[] };
    o.ids.push(r.id); o.sent++; if (done(r)) { o.done++; if (dow(r.day) <= 4) { const t = tmOf(r); if (t === 'ok') o.ot++; else if (t === 'late') o.lt++; } } if (r.day > o.last) o.last = r.day; });
  return Object.values(m).map(o => { const n = (act[o.muqraa + '|' + o.halaqa] || new Set()).size; return { ...o, active:n, fr:Math.max(0, (actS[o.muqraa + '|' + o.halaqa] || new Set()).size - o.ot - o.lt), pct:Math.round(100 * o.done / Math.max(1, n)) }; })
    .sort((a, b) => b.pct - a.pct || b.done - a.done || cmpN(a, b));
}

/* ---------------- جدول عرض الأربعاء (للإدارة والمعلمين) ---------------- */
const shDate = v => new Date(v + 'T12:00:00').toLocaleDateString('ar-SA-u-ca-gregory', { day:'numeric', month:'long' });
/* مقرر طالب في أربعاء: جلسة ذلك الأربعاء + جلسات الأربعاوات السابقة التي تأجلت أو لم تُعرض (حتى ٤ جلسات في المجموع) */
function wedPlan(st, W, pres, cyc) {
  const setOf = v => st.next_from && v >= st.next_from ? { juz: st.juz_next || st.juz, order: st.order_next || st.order } : { juz: st.juz, order: st.order };
  const stOf = v => (pres.find(p => p.sid === st.sid && p.wed === v) || {}).status || '';
  const mk = (v, carried) => { const u = setOf(v), s = sessionOf(v, cyc); return { wed: v, s, carried, n: u.juz.length, segs: juzPlan(u.juz, s, u.order) }; };
  const list = [mk(W, false)];
  for (let i = 1; i <= 3; i++) { const v = addDays(W, -7 * i), t = stOf(v); if (t !== 'postponed' && t !== 'missed') break; list.push(mk(v, true)); }
  return list.reverse();
}

/* الأوجه: الجزء ٢٠ وجهًا، فالربع ٥ أوجه؛ تُحتسب لمن حُدِّد له «عرض» فقط، وتشمل ما تأجل وعُرض معه */

const IC_ALL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 16l9 4 9-4"/></svg>';

    const tbl = (h, b) => `<table><thead><tr>${h.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${b.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    let html = `<h2>تعاهد — الإدارة — ${esc(lb.replace(/_/g, ' '))}</h2>`;
    if (wantT) html += S.mode === 'day' ? MQ.map(m => `<h3>مقرأة ${m}</h3>` + tbl(HEAD, rows.filter(r => r.muqraa === m).map(rowArr))).join('')
      : tbl(['المقرأة','الحلقة','الاسم','أيام الإرسال','أيام الإتمام','نسبة الالتزام %'], sm.map(o => [o.muqraa, o.halaqa, o.name, o.sent, o.done, o.pct]));
    if (wantP) html += '<h3>العرض الأسبوعي</h3>' + tbl(PHEAD, pr) + '<h3>أوجه العرض</h3>' + tbl(...[presSum(pr)].map(a => [a[0], a.slice(1)]).flat());
    $('#pr').innerHTML = html; window.print();
  }
}
setInterval(() => { if (S.mode === 'day' && $('#tb') && ls('tk')) load(); }, 60000);

  const day = riyadh(), w = weeklyHTML(day), r = $('#res .wk');
  if (r) r.outerHTML = w; else if (w && $('#res') && doneDays().includes(day)) { $('#res').insertAdjacentHTML('beforeend', w); reveal(); } } }).catch(() => {});
